<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Texas Wells Map</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">Texas Wells Map</div>
    <form id="search" autocomplete="off">
      <input id="search-input" type="search" placeholder="Search API number (e.g. 38934010 or 42-389-34010)" aria-label="Search API number">
      <button type="submit">Find</button>
      <span id="search-msg" role="status"></span>
    </form>
    <div id="snapshot">RRC snapshot: <span id="snapshot-date">...</span></div>
  </header>

  <main id="layout">
    <aside id="legend">
      <div class="legend-head">
        <h2>Well types</h2>
        <div class="legend-actions">
          <button id="types-all" type="button">All</button>
          <button id="types-none" type="button">None</button>
        </div>
      </div>
      <ul id="type-list"></ul>
      <div id="legend-total"></div>
    </aside>

    <section id="map-wrap">
      <canvas id="map"></canvas>
      <div id="loading">Loading wells...</div>
      <div id="tooltip" hidden></div>
    </section>

    <aside id="panel" hidden>
      <div class="panel-head">
        <div>
          <div id="panel-title"></div>
          <div id="panel-sub"></div>
        </div>
        <button id="panel-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="panel-body"></div>
    </aside>
  </main>

  <script src="renderer.bundle.js"></script>
</body>
</html>
