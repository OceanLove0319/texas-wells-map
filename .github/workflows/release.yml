# Builds the Mac and Windows installers on a version tag (v*) and attaches them,
# plus a source zip and SHA256SUMS.txt, to a GitHub Release.
#
# Data: CI never contacts the Railroad Commission. It packages the compact, pre-built
# app assets committed under app/assets/data/ (produced locally by scripts/build_data.mjs
# from the RRC snapshot) and validates them with scripts/build_check_data.mjs.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            name: mac
          - os: windows-latest
            script: dist:win
            name: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate committed data assets (data build step)
        run: npm run check-data
      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p ../out
          if [ "${{ matrix.name }}" = "mac" ]; then cp dist/*.dmg ../out/; else cp dist/*.exe ../out/; fi
          ls -la ../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          pattern: installers-*
          merge-multiple: true
      - name: Source zip and checksums
        run: |
          git archive --format=zip --prefix=texas-wells-map/ -o "out/TexasWellsMap-source.zip" HEAD
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Texas Wells Map ${GITHUB_REF_NAME}" \
            --notes "Unsigned builds. See README for Gatekeeper/SmartScreen steps and checksum verification. SHA256SUMS.txt covers every asset."
